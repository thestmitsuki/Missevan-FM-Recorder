name: Bug 报告
description: 提交 bug。也可以直接在应用「关于 → 报告问题」中打开本页并自动预填系统信息。
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望的行为是什么？可附截图。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开应用，进入「直播监控」
        2. 添加主播并触发录制
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: 系统与环境信息
      description: 应用版本、操作系统、Rust/Tauri 版本、输出目录剩余空间等。可在「调试面板」导出诊断报告并附加。
      placeholder: |
        应用版本: 0.2.0
        操作系统: Windows 10/11 ...
        录制格式/分段: M4A / 0
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已阅读「关于 → 帮助与常见问题」，问题不在已知范围内
        - label: 我已搜索已有 Issues，未发现相同问题
        - label: 我提供了版本号、系统信息及必要的日志/诊断报告
    validations:
      required: true
