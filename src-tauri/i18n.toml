# ── 后端 i18n 键值表 ──────────────────────────────────────────────────────
# 分层命名空间（嵌套 key）：[config] / [recorder] / [anchor] / [error] /
# [wizard] / [update] / [debug] / [cleanup] / [cache] / [network] / [tray] /
# [app] / [log] 等，最终 key 为 `namespace.key`（如 `config.save_ok`）。
#
# 条目格式：key = { zh = "中文原文", en = "English" }
#   - zh 必须与代码中被替换的中文原文一致（zh 模式行为零变化）
#   - 语言缺失回退 zh；key 缺失返回 key 本身并 warn（便于发现漏翻）
#   - 新增语言：需同时扩展 loader（src/infrastructure/i18n.rs 的 set_language /
#     lookup 目前只支持 zh/en），仅加字段（如 fr = "..."）不会被解析
#
# 命名占位符：{name} {count} {err} {path} 等，两端占位符名一致，翻译可调整
# 语序（代码侧用 tr!("key", name = value) 传入）。
#
# 复数（en）：en = { one = "1 file", other = "{count} files" }，配合
# tr_plural!("key", count, ...) 使用；zh 无复数，直接字符串。
# ─────────────────────────────────────────────────────────────────────────

