# 权限定义：调试命令（api/debug_cmds.rs）

[[permission]]
identifier = "allow-run-health-check"
description = "启用 run_health_check 命令（运行诊断检查并发送通知）"
commands = { allow = ["run_health_check"], deny = [] }

[[permission]]
identifier = "allow-get-debug-info"
description = "启用 get_debug_info 命令（读取调试信息概览）"
commands = { allow = ["get_debug_info"], deny = [] }

[[permission]]
identifier = "allow-get-logs"
