[package]
name = "app"
version = "0.1.0"
description = "missevan-recorder — Tauri 2 desktop app"
authors = ["thestmitsuki"]
license = "MIT"
repository = "https://github.com/thestmitsuki/Missevan-FM-Recorder"
edition = "2021"
# 发布前修正（MSRV = 依赖树最高 rust-version）：notify-rust 4.18.0 要求 1.89.0
#（tauri-plugin-notification 2.3.3 拉入，Windows 目标同样编译）；
# time 0.3.53 / time-core 0.1.9 / time-macros 0.2.31 要求 1.88.0（edition 2024）；
# 另有 20+ 包要求 1.85（edition 2024 最低）。声明 1.77.2 与事实不符，
# 本机工具链 rustc 1.96.0 ≥ 1.89.0，`cargo check` 全绿。
rust-version = "1.89.0"

[lib]
name = "missevan_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "missevan-recorder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
fs2 = "0.4"
rand = "0.8"
dirs = "6"
toml = "0.8"
# winreg 0.55（rust-version 1.60 ≤ MSRV 1.89.0；已作为 embed-resource 的传递依赖存在于锁文件）
winreg = "0.55"
# base64 0.22（rust-version 1.60 ≤ MSRV 1.89.0；已在锁文件——Task 18 敏感字段混淆）
base64 = "0.22"
url = "2"
# socks feature：全局代理 socks5 支持（spider::proxy_from_config 用 Proxy::all("socks5://…")）
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
# zip 4.3+ 需要 rustc >= 1.82（≤ MSRV 1.89.0，MSRV 可接受）；仍精确锁定 4.2.0
#（rust-version 1.75）——锁文件稳定，避免重解析引入新版本
zip = { version = "=4.2.0", default-features = false, features = ["deflate"] }
# zip 4.2.0 的传递依赖 indexmap ^2 会解析到 2.14.0（rust-version 1.85 ≤ MSRV 1.89.0，
# MSRV 可接受）；仍精确锁定 2.11.4（rust-version 1.63）——锁文件稳定
indexmap = "=2.11.4"
futures-util = "0.3.33"

# 通知（组 C/3「通知不要使用 POWERSHELL 而是应用注册通知」）：
# Windows 原生 toast 自实现——tauri-winrt-notification 直接调用 WinRT
# ToastNotificationManager，AUMID 指向本应用（启动时注册“开始菜单”快捷方式），
# 彻底绕开 tauri-plugin-notification → notify-rust 在未安装场景下
# 回退 PowerShell AUMID（Toast::POWERSHELL_APP_ID）的问题；
# windows 0.61 与 tauri-winrt-notification 0.7.3 已存在于依赖树（版本一致，无新增编译单元）。
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
# Win32_System_Threading / Win32_Security（Task 7 依赖纪律：windows 0.61 已在
# 依赖树，仅新增 feature，零新增编译单元）：单实例锁自实现（命名互斥体
# CreateMutexW + ERROR_ALREADY_EXISTS，防应用双开导致的双录——不用
# tauri-plugin-single-instance：其 2.4.3 rust-version=1.77.2 ≤ MSRV 1.89.0，但加入
# 会重解析依赖树（tauri-runtime 的 toml 0.9.12 → 1.1.0），锁文件整体变动，
# 自实现方案（infrastructure::single_instance.rs）已满足需求，故弃用）
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
